# ==============================================================================
# GroupConnect Configuration Reference (groupconnect.example.yaml)
# ==============================================================================
# Secrets (Bot Tokens, API Keys) are referenced via ${ENV_VAR} from .env.

# Root directory where agents read/write files (auto-inferred if this file is
# placed at <workspace>/.agents/groupconnect.yaml).
workspace: ~/workspace
# souls_dir: ~/workspace/.agents/souls  # Optional: defaults to <workspace>/.agents/souls if omitted

# ------------------------------------------------------------------------------
# 1. Bots & Local Execution Agents (First bot on each platform is the Arbiter)
# ------------------------------------------------------------------------------
bots:
  - name: "Code Assistant"              # Display name (used in {bot_name} templates, logs, and agent identity)
    username: "coder_bot"               # Platform handle without '@' (matches @mentions, loads {username}.md soul)
    platform: telegram                  # telegram | discord | slack | feishu | wecom
    token: "${CODER_BOT_TOKEN}"          # Platform bot token (referenced from .env)
    role: "Code authoring, debugging, automated testing, and server maintenance."  # Injected into Zero-@ routing prompts
    agent:
      engine: codex                     # Local CLI harness: codex | claude | antigravity | opencode | teleagent
      # bin: /usr/local/bin/codex       # Optional: explicit binary path (defaults to PATH lookup)
      # model: gpt-5                    # Optional: model identifier (defaults to the CLI's own default)
      # timeout_secs: 1800              # Optional: max execution time per agent turn, in seconds

    # aliases:                          # Optional: natural-language wake words (calling without '@' routes instantly)
    #   - "coder"
    #   - "dev"

    # custom_commands:                  # Optional: per-bot '/' slash commands — uncomment to enable.
    #   - command: status               # Slash command trigger without '/'
    #     description: "Check service health status"      # '/' command menu description (default locale)
    #     description_en: "Check service health status"   # English locale menu description
    #     script: "~/.local/bin/check-service.py"         # Local executable or script to run
    #     check_args: ["--check-only"]                   # Pre-check args; exit 0 -> check_success_message, skip run
    #     check_success_message: "✅ Service is healthy. To force a rerun: /{command} force"
    #     ack_message: "🚀 Running service diagnostics..."  # Sent immediately before execution starts
    #     default_args: ["--timeout", "600"]             # Args passed on normal execution
    #     force_arg: "--force"                           # Appended when user runs '/status force'
    #     success_message: "✅ Finished in {duration}s"  # Supports {output}, {stdout}, {duration}, {bot_name}
    #     error_message: "❌ Failed (Exit {returncode}): {stderr}"
    #     lock: true                                     # Prevent concurrent runs (true, or path to lockfile)
    #     arbiter_only_on_broadcast: true               # Untargeted '/cmd' in a multi-bot group runs only on the Arbiter
    #     schedule:                                     # Optional: periodic schedule (auto-runs script, broadcasts report)
    #       weekday: 6                                  # Day of week (0=Monday..6=Sunday; omit for every day)
    #       hour: 4                                     # Hour of day (0..23)

    # pattern_commands:                  # Optional: direct regex script triggers — matched plain group text runs a
    #   - pattern: "^(turn on|turn off)\\s+(lights|ac)(\\s+\\d{1,2})?$"  # local script without invoking any LLM
    #     script: "~/.local/bin/device-control.py"

  # Add more bots for multi-bot collaboration (or cross-platform hosting) by uncommenting:
  # - name: "Arch Reviewer"
  #   username: "reviewer_bot"
  #   platform: telegram
  #   token: "${REVIEWER_BOT_TOKEN}"
  #   role: "Architecture design, code review, security auditing, and technical documentation."
  #   aliases: ["reviewer", "lead"]
  #   agent:
  #     engine: antigravity
  #     bin: ~/.local/bin/agy
  #     model: gemini-3.8-flash-high

# ------------------------------------------------------------------------------
# 2. Zero-@ Autonomous Routing (Uses Jev classifier & JEV_API_KEY by default)
# ------------------------------------------------------------------------------
zero_at:
  enabled: true                         # Enable Zero-@ autonomous listening and multi-bot arbitration
  # context_window_size: 5              # Optional: recent group messages passed to the classifier (default 5)
  # classifier:                         # Optional: omit to use Jev by default (auto-reads JEV_API_KEY from env)
  #   engine: openai                    # Protocol: jev (default) | openai | anthropic | gemini
  #   model: deepseek-chat              # Classifier model identifier
  #   base_url: https://api.deepseek.com/v1  # Optional custom API endpoint URL
  # rules:                              # Optional: override built-in routing prompt slots (fill only what you want to change)
  #   group: "Engineering team group chat with specialized assistant bots."
  #   drop: "Casual human-to-human banter, acknowledgements (ok/thanks/got it), or direct conversations between teammates with no action request."
  #   immediate: "Direct command, explicit task request, follow-up amendment to an ongoing task, or reply answering a bot's earlier question/offer."
  #   wait: "Open question, inquiry, data lookup, advice request, or everyday problem asked to the group, where humans should get a chance to reply first."
  #   assignment: "Should {bot} respond? Yes if message addresses {bot} ({aliases}), asks for multiple bots, or matches its role ({role}). No if addressed to another bot or continuing an unrelated thread."

# ------------------------------------------------------------------------------
# 3. Security & Access Control
# ------------------------------------------------------------------------------
security:
  allow_open_access: false              # When false (default), strictly rejects all unknown groups and users
  allow_group_members_dm: true          # Allow members of whitelisted groups (allowed_chat_ids) to also DM the bots privately
  allowed_chat_ids:                     # Authorized group/channel IDs where the bots are allowed to respond
    - -1001234567890
  allowed_user_ids:                     # Authorized user IDs allowed direct access and admin operations
    - 123456789

# ------------------------------------------------------------------------------
# 4. Runtime Tuning (all fields have defaults — uncomment to override)
# ------------------------------------------------------------------------------
# tuning:
#   resume_unanswered_secs: 600         # On restart, re-dispatch unanswered human messages from the last N seconds (0 to disable)
#   ipc_dir: ~/.local/run/groupconnect_ipc/workspace  # Directory for cross-bot IPC heartbeats and arbitration locks (auto-isolated per workspace)
