# ==============================================================================
# GroupConnect Configuration Reference (groupconnect.example.yaml)
# ==============================================================================
# Secrets (Bot Tokens, API Keys) are referenced via ${ENV_VAR} from .env.

# 共享工作空间与人设目录（整个配置文件内全局唯一，各 Bot 自动按 {username}.md 加载人设）
workspace: ~/workspace
souls_dir: ~/workspace/.agents/souls    # 可选：不填则默认查找 <workspace>/.agents/souls

# ------------------------------------------------------------------------------
# 1. Bots & Local Execution Agents (First bot on each platform is the Arbiter)
# ------------------------------------------------------------------------------
bots:
  - name: "Code Assistant"
    username: "coder_bot"
    platform: telegram                  # telegram | discord | slack | feishu | wecom
    token: "${CODER_BOT_TOKEN}"
    options:
      auto_telegraph_threshold: 60      # Auto-fold long replies exceeding N lines into Telegraph / expandable blockquotes
    role: "Code authoring, debugging, automated testing, and server maintenance."
    aliases:
      - "coder"
      - "码农"
    agent:
      engine: codex                     # codex | claude | antigravity | opencode | teleagent
      bin: /usr/local/bin/codex         # Optional: explicit binary path (defaults to PATH lookup)
      # model: gpt-5                    # Optional: override CLI default model
      timeout_secs: 1800
      session_idle_timeout_mins: 120
    custom_commands:
      - command: status
        description: "检查服务健康状态"
        description_en: "Check service health status"
        script: "~/.local/bin/check-service.py"
        check_args: ["--check-only"]
        check_success_message: "✅ [{bot_name}] 服务当前处于健康在线状态（ONLINE）。\n如需强制重启，请输入：`/{command} force`"
        ack_message: "🚀 [{bot_name}] 正在执行服务诊断与恢复..."
        default_args: ["--timeout", "600"]
        force_arg: "--force"
        lock: true
      - command: backup
        description: "执行工作区全量备份"
        description_en: "Run full workspace backup"
        script: "~/.local/bin/workspace-backup"
        ack_message: "📦 正在执行工作区全量备份，请稍候..."
        success_message: "✅ 备份完成（耗时 {duration}s）"
        error_message: "❌ 备份失败 (Exit {returncode}): {stderr}"
        lock: true
        arbiter_only_on_broadcast: true
        schedule:
          weekday: 6
          hour: 4
    pattern_commands:
      - pattern: "^(开|关)(灯|空调)(\\d{1,2})?$|^(灯|空调)(开|关|\\d{1,2})$"
        script: "~/.local/bin/device-control.py"

  - name: "Arch Reviewer"
    username: "reviewer_bot"
    platform: telegram
    token: "${REVIEWER_BOT_TOKEN}"
    options:
      auto_telegraph_threshold: 60
    role: "Architecture design, code review, security auditing, and technical documentation."
    aliases:
      - "reviewer"
      - "评审"
    agent:
      engine: antigravity
      bin: ~/.local/bin/agy
      model: gemini-3.8-flash-high
      timeout_secs: 1800
      session_idle_timeout_mins: 120
    custom_commands:
      - command: backup
        description: "执行工作区全量备份"
        description_en: "Run full workspace backup"
        script: "~/.local/bin/workspace-backup"
        ack_message: "📦 正在执行工作区全量备份，请稍候..."
        success_message: "✅ 备份完成（耗时 {duration}s）"
        error_message: "❌ 备份失败 (Exit {returncode}): {stderr}"
        lock: true
        arbiter_only_on_broadcast: true

# ------------------------------------------------------------------------------
# 2. Zero-@ Autonomous Routing (Uses Jev classifier & JEV_API_KEY by default)
# ------------------------------------------------------------------------------
zero_at:
  enabled: true
  context_window_size: 5
  # classifier:                         # Optional: omit to use Jev by default (reads JEV_API_KEY from env)
  #   engine: openai                    # jev (default) | openai | anthropic | gemini
  #   model: deepseek-chat
  #   base_url: https://api.deepseek.com/v1
  rules:
    group: "Engineering team group chat with specialized assistant bots."
    drop: "Casual human-to-human banter, acknowledgements (ok/thanks/got it), or direct conversations between teammates with no action request."

# ------------------------------------------------------------------------------
# 3. Security & Access Control
# ------------------------------------------------------------------------------
security:
  allow_open_access: false
  allow_group_members_dm: true
  allowed_chat_ids:
    - -1001234567890
  allowed_user_ids:
    - 123456789

# ------------------------------------------------------------------------------
# 4. Runtime Tuning
# ------------------------------------------------------------------------------
tuning:
  # ipc_dir: ~/.local/run/groupconnect_ipc/workspace  # Optional: auto-isolated per workspace by default
  resume_unanswered_secs: 600
