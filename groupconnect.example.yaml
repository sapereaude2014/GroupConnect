# 2. 智能免 @ 自主感知路由 (默认使用 Jev 分类器并自动读取环境变量中的 JEV_API_KEY)
zero_at:
  enabled: true                           # 开启群内免 @ 意图识别（默认使用 jev-latest 并自动读取 JEV_API_KEY）
  context_window_size: 5                  # 可选：传入分类器的最近上下文轮数 (默认 3)
  # confidence_threshold: 0.60            # 可选：分类器触发置信度阈值 (默认 0.60)
  # parallel_threshold: 0.60              # 可选：多 Bot 并行协同触发阈值 (默认同 confidence_threshold)
  # silence_secs: 4.0                     # 可选：防抢话静默观察窗口秒数 (默认 4.0)
  # immediate_secs: 1.0                   # 可选：明确指令/追问的即刻响应延迟秒数 (默认 1.0)
  # classifier:                           # 可选：仅在需要切换其他分类模型协议、自定义端点或显式指定 api_key 时配置
  #   engine: openai                      # 接口协议: jev (默认) | openai | anthropic | gemini
  #   model: deepseek-chat                # 分类模型名称 (如 jev-latest, deepseek-chat, gpt-4o-mini, gemini-2.5-flash-lite)
  #   base_url: ""                        # 可选：自定义 API Base URL (不配置则使用所选协议的官方默认端点)
  #   api_key: ""                         # 可选：不配置则按 engine 自动读取环境变量 JEV_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY
  # rules:                                # 可选：按需原位替换内置路由提示词槽位 (仅填写需修改的项，其余沿用内置默认值)
  #   group: "这是一个私密群聊，配置了两个不同职责的专职助手 Bot。"
  #   immediate: "回复 {bot} 刚才的提问，或匹配其职责的直接指令：{role}"
  #   wait: "需要查询数据、知识或客观建议，且匹配职责：{role}"
  #   drop: "群成员之间的日常寒暄、玩笑打趣或与助手职责无关的话题"
  #   parallel: "发送者明确要求 {bot} ({role}) 与其他助手同时回答"
  # alias_drop_regex: []                  # 可选：追加自定义的第三人称提及过滤正则 (支持 {alias} 与 {any_alias} 占位符)
  # noise_regex: []                       # 可选：追加自定义的纯噪音过滤正则

# 3. 安全访问控制 (默认安全拦截未授权群组)
security:
  allow_open_access: false                # 是否开放给所有群组/用户 (默认 false)
  allow_group_members_dm: true            # 是否允许白名单群组成员直接私聊 Bot
  # allowed_chat_ids:
  #   - -100123456789                     # 允许响应的群聊 ID 列表
  # allowed_user_ids:
  #   - 123456789                         # 允许响应的管理员/用户 ID 列表
  # allowed_usernames: ["admin_user"]     # 允许响应的用户名列表 (不带 @)

# 4. 运行参数微调 (Tuning)
tuning:
  ipc_dir: /tmp/groupconnect_ipc          # 多 Bot 跨进程状态同步与裁决广播目录
  resume_unanswered_secs: 600             # 重启补偿：自动重发最近 N 秒内未获回复的人类消息 (默认 300，0 关闭)
  # max_history_len: 30                   # 内存上下文滑动窗口保留轮数 (默认 30)
