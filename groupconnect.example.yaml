# ==============================================================================
# GroupConnect 场景/工作空间配置文件 (推荐置于 <workspace>/.agents/groupconnect.yaml)
# ==============================================================================
# 架构设计（一空间一配置，随工作空间移动）：
# - 每个工作空间（如家庭空间、研发项目空间）拥有独立的 `.agents/groupconnect.yaml`；
# - 置于 `<workspace>/.agents/groupconnect.yaml` 时，默认自动以 `<workspace>` 作为当前空间根目录，
#   并自动加载 `<workspace>/.agents/souls/{username}.md` 作为各 Bot 人设，无需在每个 Bot 下重复指定路径；
# - 顶层 `zero_at`（免 @ 仲裁规则）、`security`（群白名单）、`tuning`（IPC 隔离与调优）
#   均归属于当前空间，随文件夹一起打包迁移；
# - 敏感凭证（Bot Token、API Key）通过 ${ENV_VAR} 引用 `.agents/*.env` 或全局 `~/.config/groupconnect/*.env`。

# ------------------------------------------------------------------------------
# 1. 本空间协作 Bot 矩阵 (同平台首项默认为主裁决官 Arbiter)
# ------------------------------------------------------------------------------
bots:
  - name: "瓜瓜管家"
    username: "guaguahome_bot"
    platform: telegram
    token: "${GUAGUAHOME_BOT_TOKEN}"
    options:
      auto_telegraph_threshold: 60
    role: "Home automation (Mijia appliances, AC/lights/purifier), finance and bills, train schedules and ticket grabbing, alarms/reminders, objective data lookup, household discipline supervision."
    aliases:
      - "管家"
      - "铁面管家"
      - "老铁"
    # souls_dir: /path/to/souls      # 可选：默认自动加载 <workspace>/.agents/souls/{username}.md
    agent:
      engine: teleagent              # codex | claude | antigravity | opencode | teleagent
      bin: ~/.local/bin/tele-worker
      # workspace: ~/mama_family_files  # 可选：置于 .agents/ 下时自动推导为当前空间根目录
      timeout_secs: 1800
      session_idle_timeout_mins: 120
    custom_commands:
      - command: login
        description: "准备TeleAgent登录环境并开启VNC控制台"
        description_en: "Prepare TeleAgent login form and start VNC console"
        script: "~/.local/share/TeleAgent/scripts/autologin.py"
        check_args: ["--check-only"]
        check_success_message: "✅ [{bot_name}状态]\nTeleAgent 核心引擎当前处于健康在线状态（ONLINE），无需重复登录！\n\n💡 如需强制重新呼出 VNC 控制台，请输入：`/{command} force`"
        ack_message: "🚀 [{bot_name}指令] 收到指令！正在准备 TeleAgent 登录环境并拉起 VNC 控制台..."
        default_args: ["--timeout", "600"]
        force_arg: "--force"
        lock: true
      - command: backup
        description: "执行全量资产备份至移动固态盘"
        description_en: "Backup all assets and configs to external SSD"
        script: "~/.local/bin/guagua-backup"
        ack_message: "📦 [管家备份] 收到指令！正在执行全量资产备份，请稍候..."
        success_message: "✅ [管家报告 · 备份完成]（耗时 {duration}s）"
        error_message: "❌ [管家警报] 备份执行失败 (Exit {returncode}): {stderr}"
        lock: true
        arbiter_only_on_broadcast: true
        schedule:
          weekday: 6
          hour: 4
    pattern_commands:
      - pattern: "^(开|关)(电脑|工作室空调|客厅空调|卧室空调|工作室灯|挂灯|灯带|落地灯|床头灯|卧室灯)(\\d{1,2})?$|^(电脑|工作室空调|客厅空调|卧室空调|工作室灯|挂灯|灯带|落地灯|床头灯|卧室灯)(开|关|\\d{1,2})$"
        script: "~/.local/share/guaguahome-bot/scripts/device.py"

  - name: "马马小迷妹"
    username: "guaguahome_fun_bot"
    platform: telegram
    token: "${GUAGUAHOME_FUN_BOT_TOKEN}"
    options:
      auto_telegraph_threshold: 60
    role: "Travel and weekend planning, dining and food recommendations, leisure and entertainment, emotional companionship and life quality arrangements."
    aliases:
      - "总管"
      - "大内总管"
      - "小迷妹"
    agent:
      engine: antigravity
      bin: ~/.local/bin/agy
      model: gemini-3.8-flash-high
      timeout_secs: 1800
      session_idle_timeout_mins: 120

# ------------------------------------------------------------------------------
# 2. 本空间智能免 @ 自主感知路由 (默认使用 Jev 分类器并自动读取环境变量 JEV_API_KEY)
# ------------------------------------------------------------------------------
zero_at:
  enabled: true
  context_window_size: 5
  # classifier:                      # 可选：不填则默认使用 Jev 并读取环境变量 JEV_API_KEY
  #   engine: openai                 # jev (默认) | openai | anthropic | gemini
  #   model: deepseek-chat
  #   base_url: https://api.deepseek.com/v1
  rules:
    group: "Private family group chat (husband Zheng Ma, wife xiaorou) with two specialized assistant bots."
    drop: "Direct spouse-to-spouse talk only: 2nd-person pronouns (你/咱俩), intimate address (老公/老婆/宝宝/老妹儿), reactions to the spouse's previous message, or pure venting with no action request."

# ------------------------------------------------------------------------------
# 3. 本空间安全访问控制 (仅放行当前空间的群组与成员)
# ------------------------------------------------------------------------------
security:
  allow_open_access: false
  allow_group_members_dm: true
  allowed_chat_ids:
    - -1004324820543
  allowed_user_ids:
    - 8148123619

# ------------------------------------------------------------------------------
# 4. 本空间运行参数微调 (IPC 目录默认按空间名称自动隔离)
# ------------------------------------------------------------------------------
tuning:
  # ipc_dir: ~/.local/run/groupconnect_ipc/mama_family_files  # 可选：默认自动按空间名隔离
  resume_unanswered_secs: 600
