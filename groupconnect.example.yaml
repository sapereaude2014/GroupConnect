#   - name: "代码助手"
#     username: "coder_bot"
#     token: ${CODER_BOT_TOKEN}
#     agent: codex
#     role: "负责代码编写、重构与 Bug 修复"
#     aliases: ["码农", "老铁"]
#
#   - name: "架构评审"
#     username: "reviewer_bot"
#     token: ${REVIEWER_BOT_TOKEN}
#     agent: claude
#     role: "负责代码审查、安全检查与架构设计"
#     aliases: ["评审", "总管"]
