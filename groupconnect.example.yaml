# ==============================================================================
# GroupConnect Configuration Template
# ==============================================================================
# 配置说明：
# 1. 每个 Bot 的完整定义（平台、Token、Agent 参数、职责、专属指令与正则快车道）均收敛在 bots 列表下；
# 2. 敏感信息（Token / API Key）推荐用 ${ENV_VAR} 环境变量注入，配置文件可安全入库；
#    环境变量可配置在系统环境或同目录 / ~/.config/groupconnect/ 下的 .env / *.env 文件中。
# 3. 所有字符串字段均支持 ${ENV_VAR} 或 ${ENV_VAR:-default} 插值。
# ==============================================================================

# 1. Bot 与本地执行 Agent (单 Bot 配置 1 项，多 Bot 继续追加；同平台首项默认为主裁决官 Arbiter)
bots:
  - name: "代码助手"
    username: "coder_bot"
    platform: telegram                    # 聊天平台: telegram | discord | slack | feishu | wecom
    token: "${CODER_BOT_TOKEN}"           # 从 .env / *.env 读取 Bot Token
    options:
      auto_telegraph_threshold: 60        # 可选：超长消息自动转 Telegraph 文章的行数阈值
    role: "负责代码编写、重构、自动化脚本与客观数据查询"
    aliases:
      - "码农"
      - "老铁"
    souls_dir: ~/souls                    # 可选：人设目录，按 {username}.md 自动匹配 (或用 soul_path 指定单文件)
    agent:
      engine: codex                       # 本地 Agent CLI: codex | claude | antigravity | opencode | teleagent
      bin: /usr/local/bin/codex           # 可选：显式指定 CLI 二进制绝对路径（不填则从 PATH 查找）
      # model: gpt-5                      # 可选：显式指定模型（不填则使用本地 CLI 自身默认模型）
      workspace: ~/workspace              # 本地挂载的工作空间目录 (支持 ~ 展开)
      timeout_secs: 1800                  # 可选：单次任务执行超时秒数 (默认 180)
      session_idle_timeout_mins: 120      # 可选：会话空闲自动重置分钟数 (默认 30)

    # Bot 专属自定义斜杠指令 (启动时自动同步至平台菜单与 /help)
    # custom_commands:
    #   - command: backup
    #     description: "执行全量工作区备份"
    #     description_en: "Backup workspace assets and configs"
    #     script: "~/.local/bin/my-backup"
    #     ack_message: "📦 [{bot_name}] 正在执行备份，请稍候..."
    #     success_message: "✅ [{bot_name}] 备份完成（耗时 {duration}s）！"
    #     error_message: "❌ [{bot_name}] 备份失败 (Exit {returncode}): {stderr}"
    #     lock: true                      # 进程内与跨进程并发互斥锁
    #     arbiter_only_on_broadcast: true # 群内不带 @ 广播时仅由主裁决官执行一次，防止多 Bot 重复执行
    #     schedule:                       # 可选：内置定时任务 (每周六 04:00 自动执行)
    #       weekday: 6
    #       hour: 4
    #
    #   - command: login
    #     description: "检查登录态或拉起远程登录控制台"
    #     script: "~/.local/bin/my-autologin"
    #     check_args: ["--check-only"]    # 可选：先执行健康检查，返回 0 则直接回执 check_success_message
    #     check_success_message: "✅ [{bot_name}] 核心引擎当前在线，无需重复登录（强制重登请输入 /{command} force）"
    #     ack_message: "🚀 [{bot_name}] 正在准备登录环境..."
    #     default_args: ["--timeout", "600"]
    #     force_arg: "--force"
    #     lock: true

    # Bot 专属自然语言正则快车道 (纯文本短句命中正则后直接调本地脚本，0-Token 毫秒级响应)
    # pattern_commands:
    #   - pattern: "^(开|关)(电脑|空调|卧室灯)(\\d{1,2})?$|^(电脑|空调|卧室灯)(开|关|\\d{1,2})$"
    #     script: "~/.local/bin/my-device-control"
    #     max_length: 20                  # 剥离句尾标点后超过此长度不进入快车道 (默认 20)

  # 如需同群多 Bot 协同（或跨平台托管多个 Bot），直接在此追加第 2 个 Bot：
  # - name: "架构评审"
  #   username: "reviewer_bot"
  #   platform: telegram
  #   token: "${REVIEWER_BOT_TOKEN}"
  #   options:
