[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "groupagent"
version = "1.0.0"
description = "A Group-Native, Context-Aware Local Agent Gateway for Telegram & Beyond"
readme = "README.md"
authors = [{ name = "GroupAgent Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0"
]

[project.scripts]
groupagent = "groupagent.cli:main"
